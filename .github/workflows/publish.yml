name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run prepublishOnly

      - name: Publish
        run: npm publish --access public